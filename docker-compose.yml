version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: youtube-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: youtube-keywords
    volumes:
      - mongodb_data:/data/db
    networks:
      - youtube-network

  redis:
    image: redis:7-alpine
    container_name: youtube-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - youtube-network

  meilisearch:
    image: getmeili/meilisearch:v1.5
    container_name: youtube-meilisearch
    restart: unless-stopped
    ports:
      - '7700:7700'
    environment:
      MEILI_MASTER_KEY: 'masterKey123456789'
      MEILI_ENV: 'production'
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - youtube-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: youtube-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/youtube-keywords?authSource=admin
      REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: 'masterKey123456789'
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      CACHE_TTL: 3600
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongodb
      - redis
      - meilisearch
    networks:
      - youtube-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: youtube-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - youtube-network

volumes:
  mongodb_data:
  redis_data:
  meilisearch_data:

networks:
  youtube-network:
    driver: bridge
